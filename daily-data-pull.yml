name: Daily NFL Data Pull

on:
  schedule:
    # GitHub cron uses UTC.
    # 11:17 UTC = 7:17 AM EDT (until Nov 1) / 6:17 AM EST (after)
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-data-pull-main
  cancel-in-progress: false

jobs:
  pull-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests openpyxl

      - name: Run the data pull script
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python nfl_edge_data_pull.py

      - name: Commit and push refreshed model data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Daily data update $(date -u '+%Y-%m-%d %H:%M UTC')"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
